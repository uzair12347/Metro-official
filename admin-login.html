<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Admin Login</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #111;
      color: #fff;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }
    .login-box {
      background-color: #222;
      padding: 30px;
      border-radius: 8px;
      box-shadow: 0 0 10px #00ffcc;
      width: 300px;
    }
    input {
      width: 100%;
      padding: 10px;
      margin: 10px 0;
      border: none;
      border-radius: 4px;
    }
    button {
      width: 100%;
      padding: 10px;
      background-color: #00ffcc;
      border: none;
      color: #000;
      font-weight: bold;
      cursor: pointer;
      margin-top: 10px;
    }
    .logout-btn {
      background-color: red;
      color: white;
    }
    .forgot-btn {
      background-color: orange;
      color: black;
    }
  </style>
</head>
<body>
  <div class="login-box">
    <h2>Admin Login</h2>
    <input type="text" id="admin-phone" placeholder="Enter Admin Phone" />
    <input type="password" id="admin-password" placeholder="Enter Admin Password" />
    <button onclick="login()">Login</button>
    <button onclick="forgotPassword()" class="forgot-btn">Forgot Password?</button>
    <button onclick="logout()" class="logout-btn">Logout</button>
  </div>

  <!-- Firebase SDK -->
  <script src="https://www.gstatic.com/firebasejs/9.6.10/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.6.10/firebase-firestore-compat.js"></script>

  <script>
    // Firebase Config
    const firebaseConfig = {
      apiKey: "AIzaSyBUiCellYmyU-a6ZCh0jo7O2UUe8GAV7s0",
      authDomain: "mercedezbenz79-17037.firebaseapp.com",
      databaseURL: "https://mercedezbenz79-17037-default-rtdb.firebaseio.com",
      projectId: "mercedezbenz79-17037",
      storageBucket: "mercedezbenz79-17037.firebasestorage.app",
      messagingSenderId: "328685720441",
      appId: "1:328685720441:web:ae850d085363ee4a1b55a8",
      measurementId: "G-G2K4V2LZEW"
    };

    // Initialize Firebase
    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();

    // Login Function
    async function login() {
      const phone = document.getElementById("admin-phone").value.trim();
      const password = document.getElementById("admin-password").value.trim();

      if (!phone || !password) {
        alert("❌ Please enter both phone and password.");
        return;
      }

      try {
        const snapshot = await db.collection("admin")
          .where("phone", "==", phone)
          .where("password", "==", password)
          .get();

        if (!snapshot.empty) {
          localStorage.setItem("isAdmin", "true");
          alert("✅ Login Successful!");
          window.location.href = "admin.html";
        } else {
          alert("❌ Invalid phone or password.");
        }
      } catch (err) {
        console.error(err);
        alert("❌ Firebase error. Check console.");
      }
    }

    // Logout Function
    function logout() {
      localStorage.removeItem("isAdmin");
      alert("Logged out!");
    }

    // Forgot Password Function
    async function forgotPassword() {
      const phone = prompt("Enter your admin phone number to reset password:");
      if (!phone) {
        alert("❌ Phone number is required.");
        return;
      }

      try {
        const snapshot = await db.collection("admin").where("phone", "==", phone).get();
        if (!snapshot.empty) {
          const newPassword = prompt("Enter your new password:");
          if (!newPassword) {
            alert("❌ Password cannot be empty.");
            return;
          }

          const adminDocId = snapshot.docs[0].id;
          await db.collection("admin").doc(adminDocId).update({ password: newPassword });

          alert("✅ Password updated successfully! Use the new password to login.");
        } else {
          alert("❌ Admin with this phone not found.");
        }
      } catch (err) {
        console.error(err);
        alert("❌ Error resetting password. Check console.");
      }
    }
  </script>
</body>
</html>
